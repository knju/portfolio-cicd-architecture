server {
    # Listen on port 80 (Certbot/Cloudflare will handle SSL/443 in production)
    listen 80;

    server_name knju.test; 

    # Define the document root
    root /var/www/portfolio;
    index index.html;

    # --- SECURITY HEADERS ---
    # Prevents clickjacking
    add_header X-Frame-Options "SAMEORIGIN";
    # Prevents MIME-sniffing
    add_header X-Content-Type-Options "nosniff";
    # Enables cross-site scripting filter
    add_header X-XSS-Protection "1; mode=block";
    # Prevents information leakage about the web server version
    server_tokens off;

    # --- ROUTING LOGIC ---

    # Route 1: Main Portfolio Frontend
    location / {
        try_files $uri $uri/ =404;
    }

    # API Proxy for the Contact Form    
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route 2: Hugo Write-ups Directory
    location /writeups {
        alias /var/www/portfolio/writeups;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Route 3: Deny access to hidden files (e.g., .git, .obsidian)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Route 4: Cache static assets (CSS, JS, Fonts, Images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# --- FORGEJO GIT SERVER ---
server {
    listen 80;
    
    # For VM testing, we use a custom test domain
    server_name git.knju.test;

    # CRITICAL: Nginx defaults to 1MB max uploads. 
    # Git pushes will fail with a 413 error without this.
    client_max_body_size 512M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
